name: Build Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Embutir chave OAuth do Google (se configurada nos secrets)
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            node -e "require('fs').writeFileSync('electron/google-client.json', JSON.stringify({clientId: process.env.GOOGLE_CLIENT_ID, clientSecret: process.env.GOOGLE_CLIENT_SECRET}))"
          fi
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: organizacao-credito-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
